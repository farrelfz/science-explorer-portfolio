name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Pushes the built site to the farrelfz.github.io repository (the user site,
# served at https://farrelfz.github.io/), so the portfolio IS the root site.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to farrelfz.github.io
        # Push dist/ to the user-site repo using a dedicated deploy key.
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
          ssh-add - <<< "${{ secrets.PAGES_DEPLOY_KEY }}"
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          cd dist
          git init -q
          git checkout -q -b main
          git config user.name "deploy-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7} from science-explorer-portfolio" \
            --allow-empty
          git remote add origin git@github.com:farrelfz/farrelfz.github.io.git
          git push -q origin main --force
